<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbital</title>
<link rel="icon" type="image/png" href="https://img.icons8.com/?size=1000&id=VPCmR905LNnV&format=png">
<meta name="color-scheme" content="dark">
<style>
  :root{
    --void-950:#05060b;
    --void-900:#090c16;
    --void-850:#0c1020;
    --void-800:#11162a;
    --void-700:#1a2038;
    --void-600:#262e4d;
    --star-100:#eef1fb;
    --star-300:#c1c8e0;
    --star-500:#7d87a8;
    --star-700:#4a5170;
    --signal-teal:#57e0c9;
    --signal-teal-soft:rgba(87,224,201,0.35);
    --signal-amber:#f2ac5f;
    --signal-amber-soft:rgba(242,172,95,0.35);
    --danger:#e2685f;
    --glass-bg:rgba(11,15,27,0.68);
    --glass-bg-strong:rgba(9,12,22,0.86);
    --glass-border:rgba(255,255,255,0.09);
    --radius-lg:20px;
    --radius-md:13px;
    --radius-sm:8px;
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    --font-mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Roboto Mono",ui-monospace,monospace;
    --ease:cubic-bezier(.22,.9,.32,1);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--void-950);
    color:var(--star-100);
    font-family:var(--font-display);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  body{ touch-action:none; }

  ::selection{ background:var(--signal-teal-soft); color:var(--star-100); }

  button{ font-family:inherit; color:inherit; }

  :focus-visible{
    outline:2px solid var(--signal-teal);
    outline-offset:2px;
    border-radius:4px;
  }

  /* ---------- Stage ---------- */
  #stage{
    position:fixed;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    background:var(--void-950);
    cursor:crosshair;
  }

  /* ---------- Splash ---------- */
  #splash{
    position:fixed;
    inset:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    transition:opacity .6s var(--ease);
  }
  #splash.hidden{
    opacity:0;
    pointer-events:none;
  }
  .splash-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:32px;
    animation:splashIn 1.1s var(--ease) both;
  }
  @keyframes splashIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .wordmark{
    margin:0;
    font-size:clamp(52px,11vw,132px);
    font-weight:200;
    letter-spacing:.22em;
    line-height:1;
    color:var(--star-100);
    text-shadow:0 0 60px var(--signal-teal-soft),0 0 120px rgba(87,224,201,0.12);
  }
  .subtitle{
    margin:20px 0 46px;
    font-size:14.5px;
    letter-spacing:.03em;
    font-weight:400;
    color:var(--star-500);
  }
  .launch-btn{
    position:relative;
    width:104px;
    height:104px;
    border:none;
    background:none;
    cursor:pointer;
    padding:0;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .launch-ring{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:rotate(-90deg);
  }
  .ring-track{
    fill:rgba(255,255,255,0.03);
    stroke:var(--glass-border);
    stroke-width:1.5;
  }
  .ring-fill{
    fill:none;
    stroke:var(--signal-teal);
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:339.3;
    stroke-dashoffset:339.3;
    filter:drop-shadow(0 0 6px var(--signal-teal-soft));
    transition:stroke-dashoffset .55s var(--ease);
  }
  .launch-btn:hover .ring-fill{ stroke-dashoffset:280; }
  .launch-btn.firing .ring-fill{ stroke-dashoffset:0; }
  .launch-icon{
    position:relative;
    width:30px;
    height:30px;
    color:var(--star-100);
    transition:transform .3s var(--ease);
  }
  .launch-icon svg{ width:100%; height:100%; fill:currentColor; }
  .launch-btn:hover .launch-icon{ transform:scale(1.08); color:var(--signal-teal); }
  .launch-label{
    margin-top:20px;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.35em;
    color:var(--star-500);
  }

  #flash{
    position:fixed;
    inset:0;
    z-index:50;
    background:radial-gradient(circle at center, rgba(210,240,235,0.95), var(--signal-teal) 38%, var(--void-950) 78%);
    opacity:0;
    pointer-events:none;
  }
  #flash.burst{
    animation:flashBurst .62s var(--ease) forwards;
  }
  @keyframes flashBurst{
    0%{ opacity:0; }
    18%{ opacity:1; }
    100%{ opacity:0; }
  }

  /* ---------- App shell ---------- */
  #app{
    position:fixed;
    inset:0;
    z-index:10;
    opacity:0;
    transition:opacity .5s var(--ease);
    pointer-events:none;
  }
  #app.visible{ opacity:1; }
  #app[hidden]{ display:none; }
  #app > *{ pointer-events:auto; }

  .glass{
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;
    top:14px;
    left:14px;
    right:14px;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:9px 14px;
    border-radius:var(--radius-md);
    pointer-events:none;
  }
  #hud > *{ pointer-events:auto; }
  .hud-cluster{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .hud-brand{
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:.3em;
    color:var(--star-500);
    user-select:none;
  }
  .brand-mark{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--signal-teal);
    box-shadow:0 0 8px var(--signal-teal);
    display:inline-block;
    margin-right:9px;
    vertical-align:middle;
  }
  .hud-stats{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--star-300);
    gap:0;
  }
  .stat{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:0 14px;
  }
  .stat:first-child{ padding-left:0; }
  .stat:not(:first-child){ border-left:1px solid var(--glass-border); }
  .stat-label{
    color:var(--star-700);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
  }
  .stat-value{ font-variant-numeric:tabular-nums; min-width:4.5ch; text-align:right; }
  .hud-toggles{ gap:4px; }

  .icon-btn{
    width:32px;
    height:32px;
    border-radius:var(--radius-sm);
    border:1px solid transparent;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--star-500);
    transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ background:rgba(255,255,255,0.06); color:var(--star-100); }
  .icon-btn[data-active="true"]{ color:var(--signal-teal); }
  .icon-btn[data-active="true"]:hover{ background:rgba(87,224,201,0.1); }
  .icon-btn.danger:hover{ color:var(--danger); background:rgba(226,104,95,0.1); }

  .trail-control{ position:relative; }
  .trail-popover{
    --gap:10px;
    position:absolute;
    top:calc(100% + var(--gap));
    right:-6px;
    width:184px;
    padding:12px 14px 14px;
    border-radius:var(--radius-md);
    z-index:30;
    opacity:0;
    transform:translateY(-4px);
    pointer-events:none;
    transition:opacity .16s var(--ease),transform .16s var(--ease);
  }
  /* Invisible bridge covering the visual gap between the button and the
     popover. Without it, the cursor crosses a dead zone that belongs to
     neither element while moving from the button down to the slider,
     which breaks the hover chain and closes the popover before you get
     there. As a ::before of .trail-popover it inherits pointer-events
     from its host (auto once hovered/focused, none at rest), so it only
     becomes interactive exactly while the popover itself is open. */
  .trail-popover::before{
    content:'';
    position:absolute;
    top:calc(-1 * var(--gap));
    left:0;
    right:0;
    height:var(--gap);
  }
  .trail-control:hover .trail-popover,
  .trail-control:focus-within .trail-popover{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .trail-popover-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .trail-popover-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--star-700);
  }
  .trail-popover-value{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--signal-teal);
    font-variant-numeric:tabular-nums;
  }
  .trail-popover-scale{
    display:flex;
    justify-content:space-between;
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--star-700);
    margin-top:6px;
  }

  /* ---------- Dock ---------- */
  #dockWrap{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
  }
  #dock{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    border-radius:999px;
  }
  .dock-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.03);
    color:var(--star-300);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),border-color .18s var(--ease);
  }
  .dock-btn:hover{ background:rgba(255,255,255,0.08); color:var(--star-100); }
  .dock-btn:active{ transform:scale(.94); }
  .dock-btn svg{ width:17px; height:17px; }
  .dock-btn[disabled]{ opacity:.35; cursor:not-allowed; }
  .dock-btn[disabled]:hover{ background:rgba(255,255,255,0.03); color:var(--star-300); }
  .dock-btn[data-active="true"]{
    color:var(--signal-teal);
    border-color:var(--signal-teal-soft);
    background:rgba(87,224,201,0.12);
  }
  .dock-btn[data-active="true"]:hover{ background:rgba(87,224,201,0.2); }

  .dock-btn-primary{
    width:58px;
    height:58px;
    background:linear-gradient(160deg,rgba(87,224,201,0.22),rgba(87,224,201,0.06));
    border-color:var(--signal-teal-soft);
    color:var(--signal-teal);
    box-shadow:0 0 0 rgba(87,224,201,0);
  }
  .dock-btn-primary svg{ width:20px; height:20px; }
  .dock-btn-primary:hover{ background:linear-gradient(160deg,rgba(87,224,201,0.32),rgba(87,224,201,0.1)); }
  .dock-btn-primary.running{
    color:var(--signal-amber);
    border-color:var(--signal-amber-soft);
    background:linear-gradient(160deg,rgba(242,172,95,0.22),rgba(242,172,95,0.06));
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 0 0 rgba(242,172,95,0); }
    50%{ box-shadow:0 0 18px rgba(242,172,95,0.28); }
  }
  @media (prefers-reduced-motion:reduce){
    .dock-btn-primary.running{ animation:none; }
  }

  .dock-caption{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--star-700);
  }

  /* ---------- Inspector ---------- */
  #inspector{
    position:fixed;
    top:14px;
    right:14px;
    bottom:14px;
    width:252px;
    z-index:25;
    border-radius:var(--radius-lg);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
    transform:translateX(calc(100% + 24px));
    transition:transform .38s var(--ease);
    overflow-y:auto;
  }
  #inspector.open{ transform:translateX(0); }
  #inspector[hidden]{ display:flex; }

  .insp-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .insp-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:14px;
    letter-spacing:.02em;
  }
  .insp-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
    box-shadow:0 0 8px currentColor;
  }
  .insp-close{
    width:26px;
    height:26px;
    border-radius:7px;
    border:none;
    background:transparent;
    color:var(--star-500);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .insp-close:hover{ background:rgba(255,255,255,0.07); color:var(--star-100); }
  .insp-close svg{ width:13px; height:13px; }

  .field-group{ display:flex; flex-direction:column; gap:8px; }
  .field-label{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--star-700);
  }
  .field-row{ display:flex; gap:8px; }
  .field{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field-tag{ font-size:10px; color:var(--star-700); font-family:var(--font-mono); }
  .field input[type="number"]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--glass-border);
    color:var(--star-100);
    font-family:var(--font-mono);
    font-size:13px;
    font-variant-numeric:tabular-nums;
    padding:4px 2px;
    transition:border-color .18s var(--ease);
  }
  .field input[type="number"]:focus{
    outline:none;
    border-bottom-color:var(--signal-teal);
  }
  .field input[type="number"]:disabled{ color:var(--star-500); }
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:3px;
    border-radius:2px;
    background:var(--void-700);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--signal-teal);
    box-shadow:0 0 6px var(--signal-teal-soft);
    cursor:pointer;
    margin-top:-5px;
  }
  input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border:none; border-radius:50%;
    background:var(--signal-teal); box-shadow:0 0 6px var(--signal-teal-soft); cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; background:var(--void-700); }
  input[type="range"]:disabled::-webkit-slider-thumb{ background:var(--star-700); box-shadow:none; }

  .speed-readout{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--star-500);
  }
  .speed-readout b{ color:var(--star-300); font-weight:500; }

  .field-note{
    font-size:10px;
    color:var(--star-700);
    letter-spacing:.02em;
    cursor:help;
  }
  .field-label-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .field-label-row .field-label{ flex-shrink:0; }

  .insp-delete{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px;
    border-radius:var(--radius-sm);
    border:1px solid rgba(226,104,95,0.25);
    background:rgba(226,104,95,0.06);
    color:var(--danger);
    font-size:12.5px;
    letter-spacing:.04em;
    cursor:pointer;
    transition:background .18s var(--ease);
  }
  .insp-delete:hover{ background:rgba(226,104,95,0.14); }
  .insp-delete svg{ width:14px; height:14px; }

  .insp-hint{
    font-size:11px;
    color:var(--star-700);
    line-height:1.5;
  }

  /* ---------- misc ---------- */
  @media (max-width:640px){
    .wordmark{ letter-spacing:.12em; }
    .hud-stats{ display:none; }
    #inspector{ width:min(84vw,260px); }
  }

  @media (prefers-reduced-motion:reduce){
    .splash-inner{ animation:none; }
    #splash, #app{ transition:none; }
  }
</style>
</head>
<body>

  <canvas id="stage"></canvas>

  <div id="splash">
    <div class="splash-inner">
      <h1 class="wordmark">ORBITAL</h1>
      <p class="subtitle">An infinite gravity sandbox.</p>
      <button id="launchBtn" class="launch-btn" aria-label="Start simulation">
        <svg class="launch-ring" viewBox="0 0 120 120">
          <circle class="ring-track" cx="60" cy="60" r="54"></circle>
          <circle class="ring-fill" cx="60" cy="60" r="54"></circle>
        </svg>
        <span class="launch-icon">
          <svg viewBox="0 0 24 24"><polygon points="9,6 19,12 9,18"></polygon></svg>
        </span>
      </button>
      <div class="launch-label">LAUNCH</div>
    </div>
  </div>

  <div id="flash"></div>

  <div id="app" hidden>

    <header id="hud" class="glass">
      <div class="hud-cluster hud-brand"><span class="brand-mark"></span>ORBITAL</div>
      <div class="hud-cluster hud-stats">
        <span class="stat"><span class="stat-label">Time</span><span id="statTime" class="stat-value">00:00.0</span></span>
        <span class="stat"><span class="stat-label">Bodies</span><span id="statCount" class="stat-value">0</span></span>
        <span class="stat"><span class="stat-label">Zoom</span><span id="statZoom" class="stat-value">1.00&times;</span></span>
      </div>
      <div class="hud-cluster hud-toggles">
        <button class="icon-btn" id="toggleGrid" title="Grid" data-active="true">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path></svg>
        </button>
        <button class="icon-btn" id="toggleLabels" title="Labels" data-active="true">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11V3h8l10 10-8 8-10-10Z"></path><circle cx="7" cy="7" r="1.3" fill="currentColor" stroke="none"></circle></svg>
        </button>
        <button class="icon-btn" id="toggleCOM" title="Center of mass" data-active="true">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="6.3"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg>
        </button>
        <div class="trail-control" id="trailControl">
          <button class="icon-btn" id="toggleTrails" aria-label="Trails" data-active="true">
            <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M3 16c3-7 6 7 9 0s6-7 9 0" stroke-dasharray="0.6 3.6"></path></svg>
          </button>
          <div class="trail-popover glass">
            <div class="trail-popover-head">
              <span class="trail-popover-label">Trail length</span>
              <span class="trail-popover-value" id="trailLengthValue">320</span>
            </div>
            <input type="range" id="trailLengthSlider" min="0" max="100" step="1">
            <div class="trail-popover-scale"><span>off</span><span>&infin;</span></div>
          </div>
        </div>
        <button class="icon-btn danger" id="clearAll" title="Clear all">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
        </button>
      </div>
    </header>

    <aside id="inspector" class="glass" hidden>
      <div class="insp-head">
        <div class="insp-title"><span class="insp-dot" id="inspDot"></span><span id="inspName">Body</span></div>
        <button class="insp-close" id="inspClose" aria-label="Close"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
      </div>

      <div class="field-group">
        <div class="field-label">Mass</div>
        <input type="range" id="massSlider" min="0" max="2000" step="1">

      <div class="field-group">
        <div class="field-label-row">
          <span class="field-label">Radius</span>
          <span class="field-note" title="Derived assuming constant density: r is proportional to the cube root of mass">r &prop; m<sup>1/3</sup></span>
        </div>
        <div class="speed-readout"><b id="radiusVal">0</b></div>
      </div>

      <div class="field-group">
        <div class="field-label">Position</div>
        <div class="field-row">
          <div class="field"><span class="field-tag">X</span><input type="number" id="posXInput" step="any"></div>
          <div class="field"><span class="field-tag">Y</span><input type="number" id="posYInput" step="any"></div>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">Velocity</div>
        <div class="field-row">
          <div class="field"><span class="field-tag">VX</span><input type="number" id="velXInput" step="any"></div>
          <div class="field"><span class="field-tag">VY</span><input type="number" id="velYInput" step="any"></div>
        </div>
        <div class="speed-readout">|v| = <b id="speedVal">0</b></div>
      </div>

      <div class="insp-hint" id="inspHint">While the simulation is running, values show the live state &mdash; editable again once paused.</div>

      <button class="insp-delete" id="deleteBody">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
        Remove
      </button>
    </aside>

    <div id="dockWrap">
      <div id="dock" class="glass">
        <button class="dock-btn" id="resetBtn" aria-label="Reset">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
        </button>
        <button class="dock-btn dock-btn-primary" id="playBtn" aria-label="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"></polygon></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </button>
        <button class="dock-btn" id="frameBtn" aria-label="Auto-Frame" data-active="false">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"></circle></svg>
        </button>
      </div>
      <div class="dock-caption" id="modeCaption">Editor</div>
    </div>

  </div>

<script>
// === ORBITAL ================================================================
// Gravity sandbox. Vanilla JS, a single canvas, zero dependencies.
// Physics: velocity-Verlet integration (symplectic) with a fixed sub-step,
// softening against numerical singularities, merge on collision
// (momentum- and mass-conserving). Camera: free pan/zoom, infinite plane.
// =============================================================================
(function(){
'use strict';

/* ---------------- DOM ---------------- */
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d');

const splash = document.getElementById('splash');
const launchBtn = document.getElementById('launchBtn');
const flashEl = document.getElementById('flash');
const app = document.getElementById('app');

const statTime = document.getElementById('statTime');
const statCount = document.getElementById('statCount');
const statZoom = document.getElementById('statZoom');

const toggleGrid = document.getElementById('toggleGrid');
const toggleLabels = document.getElementById('toggleLabels');
const toggleCOM = document.getElementById('toggleCOM');
const toggleTrails = document.getElementById('toggleTrails');
const trailControl = document.getElementById('trailControl');
const trailLengthSlider = document.getElementById('trailLengthSlider');
const trailLengthValue = document.getElementById('trailLengthValue');
const clearAllBtn = document.getElementById('clearAll');

const inspector = document.getElementById('inspector');
const inspDot = document.getElementById('inspDot');
const inspName = document.getElementById('inspName');
const inspClose = document.getElementById('inspClose');
const massSlider = document.getElementById('massSlider');
const massInput = document.getElementById('massInput');
const radiusVal = document.getElementById('radiusVal');
const posXInput = document.getElementById('posXInput');
const posYInput = document.getElementById('posYInput');
const velXInput = document.getElementById('velXInput');
const velYInput = document.getElementById('velYInput');
const speedVal = document.getElementById('speedVal');
const inspHint = document.getElementById('inspHint');
const deleteBodyBtn = document.getElementById('deleteBody');

const resetBtn = document.getElementById('resetBtn');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const frameBtn = document.getElementById('frameBtn');
const modeCaption = document.getElementById('modeCaption');

/* ---------------- Constants ---------------- */
// Mass has exactly one physical constraint: it must be positive. MASS_MIN
// keeps it strictly above zero (a literal 0 or negative mass has no meaning
// in the gravity law below, and would let "attraction" flip sign). MASS_MAX
// is not a design limit but a safety ceiling far beyond any meaningful scale,
// so that a long chain of merges can never overflow a double into Infinity/NaN.
const MASS_MIN = 1e-9;
const MASS_MAX = 1e300;
const PHYS_DT = 1/120;
const MAX_SUBSTEPS = 12;
const TRAIL_MIN_DIST = 1.4;
const TRAIL_LENGTH = 320; // default trail length, also the slider's starting point
const TRAIL_LEN_MIN = 20;
const TRAIL_LEN_MAX = 3000;
const VELOCITY_DRAG_SCALE = 1.5;
const HANDLE_RADIUS_PX = 6;
const HIT_PAD_PX = 6;
const HANDLE_MIN_PX = 26;
const CLICK_DRAG_THRESHOLD = 5;
const FONT_MONO = '"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Roboto Mono",ui-monospace,monospace';

// Physics constants. Deliberately not exposed in the UI: a strong pull and a
// (nearly) un-softened one make every body's mass genuinely felt, which is
// the point of the sandbox. SOFT2 only guards against a literal division by
// zero in the last instant before two bodies merge.
const G = 2500;
const SOFTENING = 2;
const SOFT2 = SOFTENING*SOFTENING;
const MASS_WHEEL_STEP = 1.0025;
const DEFAULT_BODY_MASS = 200;

// Mass-slider mapping: an unbounded log scale (a "logit"-style warp) so a
// finite slider can still sweep from near-zero to near-infinite mass. Near
// the centre (MASS_SLIDER_REF) it behaves like an ordinary log slider, just
// as before; toward either physical end of the track it accelerates
// smoothly and asymptotically toward the extremes. This only governs the
// slider handle's position - typed values in the number field are never
// limited by it (see sliderToMass/massToSlider below).
const MASS_SLIDER_STEPS = 1000;  // slider spans integer steps 0..2*MASS_SLIDER_STEPS
const MASS_SLIDER_REF = DEFAULT_BODY_MASS; // mass at dead-centre of the slider
const MASS_SLIDER_SPAN = 0.6;    // decades of mass per unit of warped coordinate
const MASS_SLIDER_TMAX = 0.995;  // keeps the warp finite at the slider's physical ends

/* ---------------- State ---------------- */
let dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
let W = window.innerWidth, H = window.innerHeight;

const camera = { x: 0, y: 0, zoom: 1 };

const params = {
  showGrid: true,
  showLabels: true,
  showCOM: true,
  showTrails: true,
};

let bodies = [];
let idSeq = 1, hueSeq = 0, labelSeq = 0;
let running = false;
let simTime = 0;
let accumulator = 0;
let snapshot = null;
let selected = null;
let hoveredBody = null;
let hoveredHandle = null;
let mergeFlashes = [];

const pointer = { x:0, y:0, worldX:0, worldY:0, down:false };
let pointerInside = false;
let dragMode = null; // 'pending' | 'move' | 'velocity' | 'pan'
let dragBody = null;
let dragOffsetX = 0, dragOffsetY = 0;
let panStart = { x:0, y:0, camX:0, camY:0 };
let pendingStart = null; // undecided empty-space gesture: click creates, drag pans
let pinch = null;
let splashActive = true;
let launched = false;
let autoFrame = false;
let trailMaxLen = TRAIL_LENGTH;
let trailInfinite = false;

/* ---------------- Helpers ---------------- */
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function round(v, d){ const f = Math.pow(10,d); return Math.round(v*f)/f; }

// Same rounded, short display as round() for every magnitude the inspector
// has ever shown - only past 1e15 (now reachable since mass is unbounded,
// but nowhere near anything reachable before) does rounding to a fixed
// number of decimal places stop meaning anything, since a double simply has
// no fractional precision left at that scale. There, fall back to a short,
// fixed-precision scientific form instead of dumping the raw value's full
// significant-digit string.
//
// neverZero: for quantities that are mathematically guaranteed to never
// actually be zero (mass), rounding must not be allowed to display a flat
// "0" - that would misrepresent a value that, however small, is always
// strictly positive. Whenever the requested decimal precision would
// otherwise round it away to nothing, this falls back to compact
// scientific notation instead, at whatever magnitude that happens (not a
// fixed threshold - exactly wherever rounding would have shown zero).
function shortDisplay(v, d, neverZero){
  if(!isFinite(v)) return 0;
  const r = round(v, d);
  if(Math.abs(r) >= 1e15) return r.toExponential(3).replace(/\.?0+e/, 'e');
  if(neverZero && v !== 0 && r === 0) return v.toExponential(2).replace(/\.?0+e/, 'e');
  return r;
}

function formatTime(t){
  const m = Math.floor(t/60);
  const s = Math.max(0, t - m*60);
  return String(m).padStart(2,'0') + ':' + s.toFixed(1).padStart(4,'0');
}

function fmtNum(v, decimals, neverZero){
  if(!isFinite(v)) return '0';
  const abs = Math.abs(v);
  // Mass and speed are no longer capped, so this on-canvas label can now be
  // asked to show magnitudes far outside its old 0..50000 comfort zone.
  // Every value that was reachable before still formats exactly as before.
  if(abs >= 1e6) return v.toExponential(1).replace(/\.?0+e/, 'e');
  if(abs >= 1000) return (v/1000).toFixed(1)+'k';
  const fixed = v.toFixed(decimals);
  // See shortDisplay above: a never-zero quantity (mass) must not collapse
  // to "0" just because it's smaller than this label's decimal precision.
  if(neverZero && v !== 0 && parseFloat(fixed) === 0) return v.toExponential(1).replace(/\.?0+e/, 'e');
  return fixed;
}

// Deterministic hash noise: produces an infinitely tileable
// starfield without ever having to store star positions.
function hash2(ix, iy, seed){
  let h = (ix*374761393 + iy*668265263 + seed*2654435761) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return ((h >>> 0) % 100000) / 100000;
}

function massToRadius(m){
  return Math.max(2.4, Math.cbrt(Math.max(m,0.001)) * 1.05);
}

function nextLabel(index){
  const greek = ['\u03b1','\u03b2','\u03b3','\u03b4','\u03b5','\u03b6','\u03b7','\u03b8','\u03b9','\u03ba','\u03bb','\u03bc','\u03bd','\u03be','\u03bf','\u03c0'];
  if(index < greek.length) return greek[index];
  return 'K' + (index - greek.length + 1);
}

/* ---------------- Bodies ---------------- */
function createBody(x, y, mass, vx, vy){
  return {
    id: idSeq++,
    x, y, vx: vx||0, vy: vy||0,
    ax: 0, ay: 0,
    mass: clamp(mass, MASS_MIN, MASS_MAX),
    hue: (hueSeq++ * 137.508) % 360,
    label: nextLabel(labelSeq++),
    trail: [],
  };
}

function cloneBodies(list){
  return list.map(b => ({ id:b.id, x:b.x, y:b.y, vx:b.vx, vy:b.vy, ax:0, ay:0, mass:b.mass, hue:b.hue, label:b.label, trail:[] }));
}

/* ---------------- Physics ---------------- */
function computeAccelerations(list){
  for(let i=0;i<list.length;i++){ list[i].ax=0; list[i].ay=0; }
  for(let i=0;i<list.length;i++){
    const A = list[i];
    for(let j=i+1;j<list.length;j++){
      const B = list[j];
      const dx = B.x-A.x, dy = B.y-A.y;
      const distSq = dx*dx + dy*dy + SOFT2;
      const dist = Math.sqrt(distSq);
      const f = G / (distSq*dist);
      A.ax += f*B.mass*dx;
      A.ay += f*B.mass*dy;
      B.ax -= f*A.mass*dx;
      B.ay -= f*A.mass*dy;
    }
  }
}

function physicsStep(dt){
  computeAccelerations(bodies);
  for(const b of bodies){
    b.vx += 0.5*b.ax*dt;
    b.vy += 0.5*b.ay*dt;
    b.x += b.vx*dt;
    b.y += b.vy*dt;
  }
  computeAccelerations(bodies);
  for(const b of bodies){
    b.vx += 0.5*b.ax*dt;
    b.vy += 0.5*b.ay*dt;
    recordTrail(b);
  }
  handleCollisions();
  simTime += dt;
}

function recordTrail(b){
  if(!params.showTrails) return;
  const last = b.trail[b.trail.length-1];
  if(!last || Math.hypot(b.x-last.x, b.y-last.y) > TRAIL_MIN_DIST){
    b.trail.push({x:b.x, y:b.y});
    if(!trailInfinite && b.trail.length > trailMaxLen) b.trail.splice(0, b.trail.length-trailMaxLen);
  }
}

function handleCollisions(){
  for(let i=0;i<bodies.length;i++){
    const A = bodies[i];
    for(let j=bodies.length-1;j>i;j--){
      const B = bodies[j];
      const dx = B.x-A.x, dy = B.y-A.y;
      const dist = Math.hypot(dx,dy);
      if(dist < massToRadius(A.mass)+massToRadius(B.mass)){
        mergeInto(A,B);
        bodies.splice(j,1);
        if(selected===B) selected=A;
        if(hoveredBody===B) hoveredBody=null;
        if(hoveredHandle===B) hoveredHandle=null;
      }
    }
  }
}

function mergeInto(A,B){
  const m = A.mass+B.mass;
  const nx = (A.x*A.mass+B.x*B.mass)/m;
  const ny = (A.y*A.mass+B.y*B.mass)/m;
  const nvx = (A.vx*A.mass+B.vx*B.mass)/m;
  const nvy = (A.vy*A.mass+B.vy*B.mass)/m;
  mergeFlashes.push({x:nx, y:ny, r:massToRadius(m), t:0});
  A.x=nx; A.y=ny; A.vx=nvx; A.vy=nvy;
  A.mass=clamp(m, MASS_MIN, MASS_MAX);
  A.trail.length = 0;
}

function computeCOM(){
  let mx=0,my=0,mt=0;
  for(const b of bodies){ mx+=b.x*b.mass; my+=b.y*b.mass; mt+=b.mass; }
  if(mt===0) return null;
  return { x: mx/mt, y: my/mt };
}

/* ---------------- Camera ---------------- */
function worldToScreen(x,y){
  return { sx: W/2 + (x-camera.x)*camera.zoom, sy: H/2 + (y-camera.y)*camera.zoom };
}
function screenToWorld(sx,sy){
  return { x: camera.x + (sx-W/2)/camera.zoom, y: camera.y + (sy-H/2)/camera.zoom };
}
function applyWorldTransform(){
  ctx.setTransform(dpr*camera.zoom, 0, 0, dpr*camera.zoom, dpr*(W/2 - camera.x*camera.zoom), dpr*(H/2 - camera.y*camera.zoom));
}
function applyScreenTransform(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function zoomAt(sx, sy, factor){
  const before = screenToWorld(sx, sy);
  camera.zoom = clamp(camera.zoom*factor, 0.015, 400);
  const after = worldToScreen(before.x, before.y);
  camera.x += (after.sx - sx)/camera.zoom;
  camera.y += (after.sy - sy)/camera.zoom;
}

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio||1));
  stage.width = Math.round(W*dpr);
  stage.height = Math.round(H*dpr);
  stage.style.width = W+'px';
  stage.style.height = H+'px';
}
window.addEventListener('resize', resize);
resize();

/* ---------------- Rendering ---------------- */
function drawStarfield(nowSec){
  applyScreenTransform();
  drawStarLayer(0.35, 260, 4, 0.5, 11, [0.8,1.5], nowSec);
  drawStarLayer(0.7, 190, 3, 0.8, 47, [0.6,1.2], nowSec);
  ctx.globalAlpha = 1;
}

function drawStarLayer(parallax, cell, perCell, alpha, seed, sizeRange, nowSec){
  const camX = camera.x*parallax, camY = camera.y*parallax;
  const viewHalfW = (W/2)/camera.zoom + cell;
  const viewHalfH = (H/2)/camera.zoom + cell;
  const minCX = Math.floor((camX-viewHalfW)/cell);
  const maxCX = Math.floor((camX+viewHalfW)/cell);
  const minCY = Math.floor((camY-viewHalfH)/cell);
  const maxCY = Math.floor((camY+viewHalfH)/cell);
  if((maxCX-minCX) > 26 || (maxCY-minCY) > 26) return;

  ctx.fillStyle = 'rgb(226,232,252)';
  for(let cx=minCX; cx<=maxCX; cx++){
    for(let cy=minCY; cy<=maxCY; cy++){
      for(let k=0;k<perCell;k++){
        const rx = hash2(cx*13+k, cy*7+k*3, seed);
        const ry = hash2(cx*7+k*5, cy*13+k*2, seed+1);
        const worldX = (cx+rx)*cell;
        const worldY = (cy+ry)*cell;
        const sx = W/2 + (worldX - camX)*camera.zoom;
        const sy = H/2 + (worldY - camY)*camera.zoom;
        if(sx<-4||sx>W+4||sy<-4||sy>H+4) continue;
        const sizeR = hash2(cx*3+k,cy*5+k,seed+2);
        const size = sizeRange[0] + sizeR*(sizeRange[1]-sizeRange[0]);
        const phase = hash2(cx*5+k, cy*9+k, seed+9)*6.283185;
        const tw = 0.6 + 0.4*Math.sin(nowSec*0.8 + phase);
        ctx.globalAlpha = alpha*tw;
        ctx.beginPath();
        ctx.arc(sx,sy,size,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
}

function drawGrid(){
  if(!params.showGrid) return;
  let spacing = 50;
  const targetPx = 70;
  while(spacing*camera.zoom < targetPx) spacing *= 2;
  while(spacing*camera.zoom > targetPx*2.4) spacing /= 2;

  applyWorldTransform();
  const viewHalfW = (W/2)/camera.zoom, viewHalfH = (H/2)/camera.zoom;
  const left = camera.x-viewHalfW, right = camera.x+viewHalfW;
  const top = camera.y-viewHalfH, bottom = camera.y+viewHalfH;
  const startX = Math.floor(left/spacing)*spacing;
  const startY = Math.floor(top/spacing)*spacing;

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1/camera.zoom;
  ctx.beginPath();
  for(let x=startX; x<=right; x+=spacing){ ctx.moveTo(x, top); ctx.lineTo(x, bottom); }
  for(let y=startY; y<=bottom; y+=spacing){ ctx.moveTo(left, y); ctx.lineTo(right, y); }
  ctx.stroke();
}

function drawTrails(){
  if(!params.showTrails) return;
  applyWorldTransform();
  const CHUNKS = 6;
  for(const b of bodies){
    const pts = b.trail;
    const n = pts.length;
    if(n < 2) continue;
    ctx.strokeStyle = 'hsl('+b.hue+',72%,58%)';
    ctx.lineWidth = Math.max(0.6, 1.5/camera.zoom);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const chunkLen = Math.max(2, Math.ceil(n/CHUNKS));
    for(let start=0; start<n-1; start+=chunkLen-1){
      const end = Math.min(n-1, start+chunkLen-1);
      const t = end/n;
      ctx.globalAlpha = 0.06 + t*0.4;
      ctx.beginPath();
      ctx.moveTo(pts[start].x, pts[start].y);
      for(let i=start+1;i<=end;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.stroke();
      if(end>=n-1) break;
    }
  }
  ctx.globalAlpha = 1;
}

function drawMergeFlashes(){
  if(!mergeFlashes.length) return;
  applyWorldTransform();
  for(const f of mergeFlashes){
    const t = f.t/0.6;
    const rad = f.r + t*f.r*3.2;
    ctx.beginPath();
    ctx.arc(f.x,f.y,rad,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(255,244,224,'+(0.7*(1-t))+')';
    ctx.lineWidth = Math.max(1, 2.2/camera.zoom);
    ctx.stroke();
  }
}

// The velocity handle is always present (even at v=0) so a freshly created,
// stationary body can immediately be dragged into motion. It defaults to
// pointing along +x and always clears the body's own radius visually.
function velocityHandlePos(b){
  const speed = Math.hypot(b.vx, b.vy);
  const r = massToRadius(b.mass);
  const minDist = Math.max(HANDLE_MIN_PX/camera.zoom, r*1.7);
  const angle = speed > 1e-6 ? Math.atan2(b.vy, b.vx) : 0;
  const dist = Math.max(speed*VELOCITY_DRAG_SCALE, minDist);
  return { x: b.x+dist*Math.cos(angle), y: b.y+dist*Math.sin(angle), angle, speed };
}

function drawVelocityVector(b){
  const hp = velocityHandlePos(b);
  const tipX = hp.x, tipY = hp.y;
  const angle = hp.angle;
  const lw = Math.max(0.9, 1.4/camera.zoom);
  const alpha = hp.speed > 1e-6 ? 0.85 : 0.4;

  ctx.strokeStyle = 'rgba(242,172,95,'+alpha+')';
  ctx.fillStyle = 'rgba(242,172,95,'+alpha+')';
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();

  const headLen = Math.max(4, 7/camera.zoom);
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - headLen*Math.cos(angle-0.45), tipY - headLen*Math.sin(angle-0.45));
  ctx.lineTo(tipX - headLen*Math.cos(angle+0.45), tipY - headLen*Math.sin(angle+0.45));
  ctx.closePath();
  ctx.fill();

  if(!running && (hoveredHandle===b || dragBody===b)){
    ctx.beginPath();
    ctx.arc(tipX, tipY, Math.max(3.5, HANDLE_RADIUS_PX/camera.zoom), 0, Math.PI*2);
    ctx.fillStyle = 'rgba(242,172,95,0.28)';
    ctx.fill();
  }
}

function drawBodies(){
  applyWorldTransform();
  for(const b of bodies){
    const r = massToRadius(b.mass);
    const col = 'hsl('+b.hue+',75%,62%)';
    const colDim = 'hsl('+b.hue+',58%,36%)';

    ctx.save();
    ctx.shadowColor = col;
    ctx.shadowBlur = Math.max(4, r*1.3);
    const grad = ctx.createRadialGradient(b.x-r*0.3, b.y-r*0.3, Math.max(0.1,r*0.05), b.x, b.y, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.35, col);
    grad.addColorStop(1, colDim);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    if(b===selected || b===hoveredBody){
      ctx.beginPath();
      ctx.arc(b.x, b.y, r + Math.max(3,4/camera.zoom), 0, Math.PI*2);
      ctx.strokeStyle = b===selected ? 'rgba(87,224,201,0.85)' : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = Math.max(1, 1.4/camera.zoom);
      ctx.stroke();
    }

    drawVelocityVector(b);
  }
}

function drawCOM(){
  if(!params.showCOM) return;
  const com = computeCOM();
  if(!com) return;
  applyWorldTransform();
  const s = Math.max(5, 9/camera.zoom);
  ctx.strokeStyle = 'rgba(242,172,95,0.9)';
  ctx.lineWidth = Math.max(1, 1.5/camera.zoom);
  ctx.beginPath();
  ctx.moveTo(com.x-s, com.y); ctx.lineTo(com.x+s, com.y);
  ctx.moveTo(com.x, com.y-s); ctx.lineTo(com.x, com.y+s);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(com.x, com.y, s*0.5, 0, Math.PI*2);
  ctx.stroke();
}

function drawMiniLabels(){
  if(!params.showLabels) return;
  applyScreenTransform();
  ctx.font = '11px ' + FONT_MONO;
  ctx.textBaseline = 'middle';
  for(const b of bodies){
    const r = massToRadius(b.mass);
    const p = worldToScreen(b.x, b.y);
    if(p.sx < -60 || p.sx > W+60 || p.sy < -60 || p.sy > H+60) continue;
    const offset = r*camera.zoom + 9;
    const speed = Math.hypot(b.vx,b.vy);
    ctx.fillStyle = 'hsla('+b.hue+',85%,74%,0.95)';
    ctx.fillText(b.label, p.sx+offset, p.sy-6);
    ctx.fillStyle = 'rgba(196,203,224,0.55)';
    ctx.fillText(fmtNum(b.mass,0,true) + ' \u00b7 v ' + fmtNum(speed,2), p.sx+offset, p.sy+7);
  }
}

function drawCreatePreview(){
  if(running || pointer.down || !pointerInside) return;
  if(hoveredBody || hoveredHandle) return;
  applyWorldTransform();
  const r = massToRadius(DEFAULT_BODY_MASS);
  ctx.beginPath();
  ctx.arc(pointer.worldX, pointer.worldY, r, 0, Math.PI*2);
  ctx.setLineDash([3/camera.zoom, 4/camera.zoom]);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = Math.max(1, 1.2/camera.zoom);
  ctx.stroke();
  ctx.setLineDash([]);
}

function render(nowSec){
  applyScreenTransform();
  ctx.clearRect(0,0,W,H);

  drawStarfield(nowSec);
  drawGrid();
  drawTrails();
  drawMergeFlashes();
  drawBodies();
  drawCOM();
  drawMiniLabels();
  drawCreatePreview();

  statTime.textContent = formatTime(simTime);
  statCount.textContent = String(bodies.length);
  statZoom.textContent = camera.zoom.toFixed(2) + '\u00d7';
}

/* ---------------- Main loop ---------------- */
let lastFrameT = performance.now();

function frame(now){
  let delta = (now - lastFrameT)/1000;
  lastFrameT = now;
  if(delta > 0.25) delta = 0.25;

  if(splashActive && !running){
    camera.x += 3.2*delta;
    camera.y += 0.9*delta;
  }
  if(autoFrame && running){
    applyAutoFrame(delta);
  }

  if(running){
    accumulator += delta;
    let steps = 0;
    while(accumulator >= PHYS_DT && steps < MAX_SUBSTEPS){
      physicsStep(PHYS_DT);
      accumulator -= PHYS_DT;
      steps++;
    }
    syncInspectorLive();
  }

  for(let i=mergeFlashes.length-1;i>=0;i--){
    mergeFlashes[i].t += delta;
    if(mergeFlashes[i].t > 0.6) mergeFlashes.splice(i,1);
  }

  render(now/1000);
  requestAnimationFrame(frame);
}

/* ---------------- Selection / inspector ---------------- */
function selectBody(b){
  selected = b;
  inspector.hidden = false;
  requestAnimationFrame(()=> inspector.classList.add('open'));
  syncInspectorFields();
}

function deselect(){
  selected = null;
  inspector.classList.remove('open');
  setTimeout(()=>{ if(!selected) inspector.hidden = true; }, 400);
}

function deleteBodyObj(b){
  const idx = bodies.indexOf(b);
  if(idx>=0) bodies.splice(idx,1);
  if(selected===b) deselect();
  if(hoveredBody===b) hoveredBody=null;
  if(hoveredHandle===b) hoveredHandle=null;
  if(dragBody===b){ dragBody=null; dragMode=null; }
  updatePlayButtonUI();
}

// Forward and inverse of the smooth warp t/(1-|t|), which maps (-1,1) onto
// (-Infinity,Infinity). Both directions share one shape because x/(1-|x|)
// and its inverse y/(1+|y|) are the same family of function - one folds the
// line into a bounded interval, the other unfolds it again.
function warpToUnbounded(t){ return t/(1-Math.abs(t)); }  // (-1,1) -> R
function warpToBounded(y){ return y/(1+Math.abs(y)); }    // R -> (-1,1)

function massToSlider(m){
  if(!(m > 0)) return 0;
  const y = Math.log10(m/MASS_SLIDER_REF)/MASS_SLIDER_SPAN;
  const t = warpToBounded(y);
  const s = MASS_SLIDER_STEPS + (t/MASS_SLIDER_TMAX)*MASS_SLIDER_STEPS;
  return Math.round(clamp(s, 0, 2*MASS_SLIDER_STEPS));
}
function sliderToMass(s){
  const t = MASS_SLIDER_TMAX * (s-MASS_SLIDER_STEPS)/MASS_SLIDER_STEPS;
  const y = warpToUnbounded(t);
  return clamp(MASS_SLIDER_REF * Math.pow(10, y*MASS_SLIDER_SPAN), MASS_MIN, MASS_MAX);
}

// Trail-length slider: 0 is an explicit "off" (equivalent to one click of the
// Trails toggle), 100 is an explicit "infinite" (trail never truncated), and
// everything in between is a log scale across TRAIL_LEN_MIN..TRAIL_LEN_MAX so
// both very short and very long trails stay easy to dial in.
function trailLenFromSlider(v){
  v = clamp(v,0,100);
  if(v <= 0) return 0;
  if(v >= 100) return Infinity;
  const t = (v-1)/98;
  return Math.round(TRAIL_LEN_MIN * Math.pow(TRAIL_LEN_MAX/TRAIL_LEN_MIN, t));
}
function sliderFromTrailLen(len){
  if(!isFinite(len)) return 100;
  if(len <= 0) return 0;
  const t = Math.log(clamp(len,TRAIL_LEN_MIN,TRAIL_LEN_MAX)/TRAIL_LEN_MIN) / Math.log(TRAIL_LEN_MAX/TRAIL_LEN_MIN);
  return Math.round(1 + t*98);
}
function trailStatusLabel(){
  if(!params.showTrails) return 'off';
  if(trailInfinite) return '\u221e';
  return String(trailMaxLen);
}
function syncTrailPopover(){
  trailLengthSlider.value = params.showTrails ? sliderFromTrailLen(trailInfinite ? Infinity : trailMaxLen) : 0;
  trailLengthValue.textContent = trailStatusLabel();
}

function syncInspectorFields(){
  if(!selected) return;
  const b = selected;
  inspDot.style.background = 'hsl('+b.hue+',75%,62%)';
  inspDot.style.color = 'hsl('+b.hue+',75%,62%)';
  inspName.textContent = 'Body ' + b.label;

  const disabled = running;
  [massSlider, massInput, posXInput, posYInput, velXInput, velYInput].forEach(el => el.disabled = disabled);
  inspHint.style.display = running ? 'block' : 'none';

  if(document.activeElement !== massInput) massInput.value = shortDisplay(b.mass,1,true);
  if(document.activeElement !== massSlider) massSlider.value = massToSlider(b.mass);
  radiusVal.textContent = shortDisplay(massToRadius(b.mass),2);
  if(document.activeElement !== posXInput) posXInput.value = shortDisplay(b.x,1);
  if(document.activeElement !== posYInput) posYInput.value = shortDisplay(b.y,1);
  if(document.activeElement !== velXInput) velXInput.value = shortDisplay(b.vx,2);
  if(document.activeElement !== velYInput) velYInput.value = shortDisplay(b.vy,2);
  speedVal.textContent = shortDisplay(Math.hypot(b.vx,b.vy),2);
}

function syncInspectorLive(){ if(selected) syncInspectorFields(); }

massSlider.addEventListener('input', () => {
  if(!selected || running) return;
  selected.mass = clamp(sliderToMass(Number(massSlider.value)), MASS_MIN, MASS_MAX);
  massInput.value = shortDisplay(selected.mass,1,true);
  radiusVal.textContent = shortDisplay(massToRadius(selected.mass),2);
});
massInput.addEventListener('input', () => {
  if(!selected || running) return;
  const v = parseFloat(massInput.value);
  if(!isFinite(v)) return;
  selected.mass = clamp(v, MASS_MIN, MASS_MAX);
  massSlider.value = massToSlider(selected.mass);
  radiusVal.textContent = shortDisplay(massToRadius(selected.mass),2);
});
posXInput.addEventListener('input', () => { if(selected && !running && isFinite(parseFloat(posXInput.value))) selected.x = parseFloat(posXInput.value); });
posYInput.addEventListener('input', () => { if(selected && !running && isFinite(parseFloat(posYInput.value))) selected.y = parseFloat(posYInput.value); });
velXInput.addEventListener('input', () => {
  if(!selected || running) return;
  const v = parseFloat(velXInput.value);
  if(!isFinite(v)) return;
  selected.vx = v;
  speedVal.textContent = shortDisplay(Math.hypot(selected.vx,selected.vy),2);
});
velYInput.addEventListener('input', () => {
  if(!selected || running) return;
  const v = parseFloat(velYInput.value);
  if(!isFinite(v)) return;
  selected.vy = v;
  speedVal.textContent = shortDisplay(Math.hypot(selected.vx,selected.vy),2);
});

// Detail view, on demand: at rest, the four fields above show the short,
// rounded values they always have (unchanged). The moment one is focused
// for editing, it's replaced with the exact underlying number - to however
// many decimal places it actually has, not an arbitrary fixed count -
// courtesy of JS's own shortest-round-trip number formatting. Blurring
// restores the rounded display via the normal sync path. No new UI: the
// precise value only ever appears when you click in to change it.
function fullPrecisionStr(v){ return isFinite(v) ? String(v) : '0'; }
function bindPreciseField(input, getValue){
  input.addEventListener('focus', () => {
    if(!selected) return;
    input.value = fullPrecisionStr(getValue());
  });
  input.addEventListener('blur', syncInspectorFields);
}
bindPreciseField(massInput, () => selected.mass);
bindPreciseField(posXInput, () => selected.x);
bindPreciseField(posYInput, () => selected.y);
bindPreciseField(velXInput, () => selected.vx);
bindPreciseField(velYInput, () => selected.vy);

inspClose.addEventListener('click', deselect);
deleteBodyBtn.addEventListener('click', () => { if(selected) deleteBodyObj(selected); });

/* ---------------- Hit testing ---------------- */
function findBodyAt(wx, wy){
  for(let i=bodies.length-1;i>=0;i--){
    const b = bodies[i];
    const r = massToRadius(b.mass) + HIT_PAD_PX/camera.zoom;
    if(Math.hypot(wx-b.x, wy-b.y) <= r) return b;
  }
  return null;
}
function findHandleAt(wx, wy){
  for(let i=bodies.length-1;i>=0;i--){
    const b = bodies[i];
    const hp = velocityHandlePos(b);
    const rad = HANDLE_RADIUS_PX/camera.zoom + HIT_PAD_PX/camera.zoom;
    if(Math.hypot(wx-hp.x, wy-hp.y) <= rad) return b;
  }
  return null;
}

/* ---------------- Input ---------------- */
function handlePointerDown(sx, sy, button, shiftKey){
  const w = screenToWorld(sx,sy);
  pointer.down = true;
  pointer.x=sx; pointer.y=sy; pointer.worldX=w.x; pointer.worldY=w.y;

  if(button === 2 || button === 1){
    if(autoFrame && running) return;
    dragMode = 'pan';
    panStart = { x: sx, y: sy, camX: camera.x, camY: camera.y };
    stage.style.cursor = 'grabbing';
    return;
  }
  if(button !== 0) return;

  if(shiftKey){
    const hitS = findBodyAt(w.x,w.y);
    if(hitS) deleteBodyObj(hitS);
    dragMode = null;
    return;
  }

  const handleHit = !running ? findHandleAt(w.x,w.y) : null;
  if(handleHit){
    dragMode = 'velocity'; dragBody = handleHit;
    return;
  }

  const bodyHit = findBodyAt(w.x,w.y);
  if(bodyHit){
    selectBody(bodyHit);
    if(running){ dragMode = null; return; }
    dragMode = 'move'; dragBody = bodyHit;
    dragOffsetX = w.x-bodyHit.x; dragOffsetY = w.y-bodyHit.y;
    return;
  }

  // Empty space, and simulation running: only the camera can move.
  if(running){
    if(!autoFrame){
      dragMode = 'pan';
      panStart = { x: sx, y: sy, camX: camera.x, camY: camera.y };
      stage.style.cursor = 'grabbing';
    }
    return;
  }

  // Empty space, editor: the gesture is undecided until it resolves as
  // either a drag (pans the view, like dragging a map) or a plain click
  // (drops a new body right where the cursor is).
  dragMode = 'pending';
  pendingStart = { sx, sy, wx: w.x, wy: w.y };
}

function handlePointerMove(sx, sy){
  const w = screenToWorld(sx,sy);
  pointer.x=sx; pointer.y=sy; pointer.worldX=w.x; pointer.worldY=w.y;

  if(dragMode === 'pending'){
    const moved = Math.hypot(sx-pendingStart.sx, sy-pendingStart.sy);
    if(moved > CLICK_DRAG_THRESHOLD){
      dragMode = 'pan';
      panStart = { x: pendingStart.sx, y: pendingStart.sy, camX: camera.x, camY: camera.y };
      stage.style.cursor = 'grabbing';
    }
    return;
  }
  if(dragMode === 'pan'){
    camera.x = panStart.camX - (sx-panStart.x)/camera.zoom;
    camera.y = panStart.camY - (sy-panStart.y)/camera.zoom;
    return;
  }
  if(dragMode === 'move' && dragBody){
    dragBody.x = w.x-dragOffsetX; dragBody.y = w.y-dragOffsetY;
    if(selected===dragBody) syncInspectorFields();
    return;
  }
  if(dragMode === 'velocity' && dragBody){
    dragBody.vx = (w.x-dragBody.x)/VELOCITY_DRAG_SCALE;
    dragBody.vy = (w.y-dragBody.y)/VELOCITY_DRAG_SCALE;
    if(selected===dragBody) syncInspectorFields();
    return;
  }
  if(!pointer.down){
    hoveredHandle = !running ? findHandleAt(w.x,w.y) : null;
    hoveredBody = hoveredHandle ? null : findBodyAt(w.x,w.y);
    stage.style.cursor = (hoveredHandle||hoveredBody) ? (running?'pointer':'grab') : (running?'default':'crosshair');
  }
}

function handlePointerUp(){
  if(dragMode === 'pending'){
    // No real movement happened: treat it as a click and drop a body here.
    const nb = createBody(pendingStart.wx, pendingStart.wy, DEFAULT_BODY_MASS, 0, 0);
    bodies.push(nb);
    selectBody(nb);
    updatePlayButtonUI();
  }
  if(dragMode==='pan') stage.style.cursor = pointerInside ? (running?'default':'crosshair') : 'default';
  pointer.down = false;
  dragMode = null;
  dragBody = null;
  pendingStart = null;
}

stage.addEventListener('mousedown', (e) => {
  if(!launched) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  handlePointerDown(e.clientX-r.left, e.clientY-r.top, e.button, e.shiftKey);
});
stage.addEventListener('mousemove', (e) => {
  if(!launched) return;
  const r = stage.getBoundingClientRect();
  handlePointerMove(e.clientX-r.left, e.clientY-r.top);
});
window.addEventListener('mouseup', handlePointerUp);
stage.addEventListener('mouseenter', () => { pointerInside = true; });
stage.addEventListener('mouseleave', () => { pointerInside = false; hoveredBody = null; hoveredHandle = null; });
stage.addEventListener('contextmenu', (e) => e.preventDefault());
// Plain scrolling zooms in/out on whatever point the cursor is over, exactly
// like Google Maps: no modifier key needed. The one exception is hovering an
// existing body in the editor, where scrolling instead grows or shrinks its
// mass directly, which is more useful there than zooming ever would be.
function normalizedWheelDelta(e){
  let dy = e.deltaY;
  if(e.deltaMode === 1) dy *= 18;
  else if(e.deltaMode === 2) dy *= H;
  return dy;
}
stage.addEventListener('wheel', (e) => {
  if(!launched) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const sx = e.clientX-r.left, sy = e.clientY-r.top;
  const w = screenToWorld(sx, sy);
  const dy = normalizedWheelDelta(e);

  const hitBody = !running ? findBodyAt(w.x, w.y) : null;
  if(hitBody){
    const factor = Math.pow(MASS_WHEEL_STEP, -dy);
    hitBody.mass = clamp(hitBody.mass*factor, MASS_MIN, MASS_MAX);
    if(selected === hitBody) syncInspectorFields();
    return;
  }

  if(autoFrame && running) return; // camera is under automatic control while Auto-Frame is active

  const factor = Math.pow(1.0028, -dy);
  zoomAt(sx, sy, factor);
}, { passive:false });

function touchPointFromEvent(e){
  const t = e.touches[0] || e.changedTouches[0];
  const r = stage.getBoundingClientRect();
  return { sx: t.clientX-r.left, sy: t.clientY-r.top };
}
stage.addEventListener('touchstart', (e) => {
  if(!launched) return;
  e.preventDefault();
  if(e.touches.length === 2){
    dragMode = null; dragBody = null; pointer.down = false;
    if(autoFrame && running){ pinch = null; return; }
    const t0=e.touches[0], t1=e.touches[1];
    const r = stage.getBoundingClientRect();
    pinch = {
      startDist: Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY),
      startZoom: camera.zoom,
      midSx: (t0.clientX+t1.clientX)/2-r.left,
      midSy: (t0.clientY+t1.clientY)/2-r.top,
      camX: camera.x, camY: camera.y,
    };
    return;
  }
  pointerInside = true;
  const p = touchPointFromEvent(e);
  handlePointerDown(p.sx, p.sy, 0, false);
}, { passive:false });
stage.addEventListener('touchmove', (e) => {
  if(!launched) return;
  e.preventDefault();
  if(e.touches.length === 2 && pinch){
    const t0=e.touches[0], t1=e.touches[1];
    const r = stage.getBoundingClientRect();
    const dist = Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
    const midSx = (t0.clientX+t1.clientX)/2-r.left, midSy = (t0.clientY+t1.clientY)/2-r.top;
    camera.zoom = clamp(pinch.startZoom*(dist/pinch.startDist), 0.015, 400);
    camera.x = pinch.camX - (midSx-pinch.midSx)/camera.zoom;
    camera.y = pinch.camY - (midSy-pinch.midSy)/camera.zoom;
    return;
  }
  const p = touchPointFromEvent(e);
  handlePointerMove(p.sx, p.sy);
}, { passive:false });
stage.addEventListener('touchend', (e) => {
  if(!launched) return;
  e.preventDefault();
  pinch = null;
  handlePointerUp();
}, { passive:false });

window.addEventListener('keydown', (e) => {
  if(!launched) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if(e.code === 'Space' && tag !== 'INPUT'){
    e.preventDefault();
    togglePlay();
  }
  if(e.code === 'Escape'){
    deselect();
  }
  if((e.code === 'Delete' || e.code === 'Backspace') && selected && tag !== 'INPUT'){
    e.preventDefault();
    deleteBodyObj(selected);
  }
});

/* ---------------- Dock: Play / Reset / Fit ---------------- */
function updatePlayButtonUI(){
  playIcon.hidden = running;
  pauseIcon.hidden = !running;
  playBtn.classList.toggle('running', running);
  modeCaption.textContent = running ? 'Simulation' : 'Editor';
  playBtn.disabled = !running && bodies.length===0;
}

function togglePlay(){
  if(!running){
    if(bodies.length===0) return;
    snapshot = cloneBodies(bodies);
    running = true;
    lastFrameT = performance.now();
    accumulator = 0;
  } else {
    running = false;
  }
  syncInspectorFields();
  updatePlayButtonUI();
}

function resetToSnapshot(){
  running = false;
  simTime = 0;
  accumulator = 0;
  mergeFlashes = [];
  bodies = snapshot ? cloneBodies(snapshot) : bodies.map(b => { b.trail.length=0; return b; });
  deselect();
  updatePlayButtonUI();
}

function computeFitTarget(){
  if(bodies.length===0) return { x:0, y:0, zoom:1 };
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const b of bodies){
    const r = massToRadius(b.mass);
    minX=Math.min(minX,b.x-r); maxX=Math.max(maxX,b.x+r);
    minY=Math.min(minY,b.y-r); maxY=Math.max(maxY,b.y+r);
  }
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const spanX = Math.max(80, maxX-minX), spanY = Math.max(80, maxY-minY);
  const margin = 1.4;
  const zoom = clamp(Math.min(W/(spanX*margin), H/(spanY*margin)), 0.015, 400);
  return { x:cx, y:cy, zoom };
}

function snapToFit(){
  const t = computeFitTarget();
  camera.x = t.x; camera.y = t.y; camera.zoom = t.zoom;
}

// Continuously keeps every body in view, as tightly as possible, by easing
// the camera toward the current fitting frame every tick. Only runs while
// the simulation is playing (see the frame loop); while active, manual
// pan/zoom is suppressed (see the wheel and pointer handlers) so it doesn't
// fight the auto camera.
function applyAutoFrame(dt){
  const t = computeFitTarget();
  const k = 1 - Math.exp(-6*dt);
  camera.x += (t.x-camera.x)*k;
  camera.y += (t.y-camera.y)*k;
  camera.zoom += (t.zoom-camera.zoom)*k;
}

function setAutoFrame(on){
  autoFrame = on;
  frameBtn.dataset.active = on ? 'true' : 'false';
}

playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', resetToSnapshot);
frameBtn.addEventListener('click', () => setAutoFrame(!autoFrame));
clearAllBtn.addEventListener('click', () => {
  bodies = [];
  deselect();
  updatePlayButtonUI();
});

/* ---------------- HUD toggles ---------------- */
function bindToggle(btn, key){
  btn.addEventListener('click', () => {
    params[key] = !params[key];
    btn.dataset.active = params[key] ? 'true' : 'false';
  });
}
bindToggle(toggleGrid, 'showGrid');
bindToggle(toggleLabels, 'showLabels');
bindToggle(toggleCOM, 'showCOM');
bindToggle(toggleTrails, 'showTrails');
toggleTrails.addEventListener('click', syncTrailPopover);

trailControl.addEventListener('mouseenter', syncTrailPopover);
// Dragging the slider gives it keyboard focus, and that focus persists
// after mouseup. Since the popover is kept open via :focus-within (needed
// so Tab-focusing the slider works without hovering), the popover would
// otherwise stay open after the mouse leaves until something else steals
// focus. Track whether focus came from a pointer press, and if so, drop
// it on mouseleave so :focus-within releases and the popover closes like
// a plain hover popover. Focus gained via Tab is left untouched.
let trailFocusFromPointer = false;
trailLengthSlider.addEventListener('pointerdown', () => { trailFocusFromPointer = true; });
trailControl.addEventListener('mouseleave', () => {
  if(trailFocusFromPointer && document.activeElement === trailLengthSlider){
    trailLengthSlider.blur();
  }
  trailFocusFromPointer = false;
});
trailLengthSlider.addEventListener('input', () => {
  const v = Number(trailLengthSlider.value);
  if(v <= 0){
    params.showTrails = false;
  } else {
    params.showTrails = true;
    trailInfinite = (v >= 100);
    if(!trailInfinite) trailMaxLen = trailLenFromSlider(v);
  }
  toggleTrails.dataset.active = params.showTrails ? 'true' : 'false';
  trailLengthValue.textContent = trailStatusLabel();
});
syncTrailPopover();

/* ---------------- Default scene ---------------- */
// A close binary pair (both bodies visibly orbit their shared barycenter,
// so mutual gravity is unmistakable) plus one lighter companion on a wide,
// genuinely chaotic orbit around them. Verified numerically to stay bound
// and collision-free for at least 900 simulated seconds.
function buildDefaultScene(){
  bodies = [];
  idSeq=1; hueSeq=0; labelSeq=0;

  const m1=900, m2=700, d=320;
  const r1 = d*m2/(m1+m2), r2 = d*m1/(m1+m2);
  const omega = Math.sqrt(G*(m1+m2)/(d*d*d));
  const v1 = omega*r1, v2 = omega*r2;

  const m3=150, R3=900;
  const v3 = Math.sqrt(G*(m1+m2)/R3);

  const a = createBody(-r1, 0, m1, 0, -v1);
  const b = createBody(r2, 0, m2, 0, v2);
  const c = createBody(0, R3, m3, -v3, 0);
  bodies.push(a,b,c);
  zeroOutCOMVelocity();
}
function zeroOutCOMVelocity(){
  let mx=0,my=0,mt=0;
  for(const b of bodies){ mx+=b.mass*b.vx; my+=b.mass*b.vy; mt+=b.mass; }
  if(mt===0) return;
  const cvx=mx/mt, cvy=my/mt;
  for(const b of bodies){ b.vx-=cvx; b.vy-=cvy; }
}

/* ---------------- Splash / Launch ---------------- */
function reqFullscreen(){
  const el = document.documentElement;
  try{
    (el.requestFullscreen||el.webkitRequestFullscreen||
     el.mozRequestFullScreen||el.msRequestFullscreen||(()=>{})).call(el);
  }catch(e){}
}

function triggerLaunch(){
  if(launched) return;
  launched = true;
  reqFullscreen();
  launchBtn.classList.add('firing');
  launchBtn.setAttribute('aria-disabled','true');
  setTimeout(() => {
    resize();
    flashEl.classList.add('burst');
    splash.classList.add('hidden');
    splashActive = false;
    app.hidden = false;
    requestAnimationFrame(()=> app.classList.add('visible'));
    buildDefaultScene();
    camera.x = 0; camera.y = 0; camera.zoom = 1;
    updatePlayButtonUI();
    setTimeout(snapToFit, 30);
  }, 520);
}

launchBtn.addEventListener('click', triggerLaunch);
window.addEventListener('keydown', (e) => {
  if(launched) return;
  if(e.code === 'Enter' || e.code === 'Space'){
    e.preventDefault();
    triggerLaunch();
  }
});

/* ---------------- Start ---------------- */
requestAnimationFrame(frame);

})();
</script>
