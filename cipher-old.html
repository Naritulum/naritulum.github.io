<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cipher</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/?size=1000&id=kDMAGBvpqAyW&format=png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #fff;
      padding: 36px 50px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 560px;
    }

    .toggle-bar {
      display: flex;
      background: #f4f6f8;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      position: relative;
    }

    .toggle-bar button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      font-size: 1rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 9px;
      color: #999;
      transition: color 0.2s;
      position: relative;
      z-index: 1;
    }

    .toggle-bar button.active {
      color: #333;
    }

    .toggle-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      width: calc(50% - 4px);
      background: #fff;
      border-radius: 9px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
    }

    .toggle-slider.right {
      transform: translateX(calc(100% + 4px));
    }

    .swap-row {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .swap-btn {
      background: #f4f6f8;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.15s, transform 0.2s;
      color: #555;
    }

    .swap-btn:hover {
      background: #e8eaed;
      transform: scale(1.08);
    }

    .swap-btn svg {
      width: 18px;
      height: 18px;
    }

    .box-label {
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .box-wrapper {
      position: relative;
    }

    textarea {
      width: 100%;
      height: 130px;
      border: 2px solid #e8eaed;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-family: Arial, sans-serif;
      color: #333;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      background: #fafbfc;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: #bbb;
      background: #fff;
    }

    textarea.output {
      background: #f4f6f8;
      color: #444;
      cursor: default;
      border-color: #e8eaed;
    }

    .copy-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.82rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      color: #555;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .copy-btn:hover {
      background: #f4f6f8;
      border-color: #bbb;
    }

    .copy-btn.copied {
      color: #43a047;
      border-color: #43a047;
    }

    .clear-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #fff;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-size: 0.82rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
      cursor: pointer;
      color: #555;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clear-btn:hover {
      background: #f4f6f8;
      border-color: #bbb;
    }

    @media (max-width: 600px) {
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="toggle-bar">
    <div class="toggle-slider" id="toggleSlider"></div>
    <button class="active" id="btnEncrypt" onclick="setMode('encrypt')">🔒 Encrypt</button>
    <button id="btnDecrypt" onclick="setMode('decrypt')">🔓 Decrypt</button>
  </div>

  <div class="box-label" id="labelInput">Text</div>
  <div class="box-wrapper">
    <textarea id="inputBox" spellcheck="false" oninput="handleInput()"></textarea>
    <button class="clear-btn" onclick="clearInput()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="swap-row">
    <button class="swap-btn" onclick="swapMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="17 1 21 5 17 9"/>
        <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
        <polyline points="7 23 3 19 7 15"/>
        <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
      </svg>
    </button>
  </div>

  <div class="box-label" id="labelOutput">Encrypted</div>
  <div class="box-wrapper">
    <textarea id="outputBox" class="output" readonly placeholder="Output…"></textarea>
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>
</div>

<script>
  let mode = 'encrypt';

  // ── Lookup tables ─────────────────────────────────────────────────────────

  // Digits → internal bb* codes (used only inside encrypt; not typeable by user)
  const DIGIT_CODES_ENC = {
    '0':'bbb','1':'bbc','2':'bbd','3':'bbf','4':'bbg',
    '5':'bbh','6':'bbj','7':'bbk','8':'bbm','9':'bbn'
  };
  const DIGIT_CODES_DEC = {
    'bbb':'0','bbc':'1','bbd':'2','bbf':'3','bbg':'4',
    'bbh':'5','bbj':'6','bbk':'7','bbm':'8','bbn':'9'
  };

  // Allowed punctuation → 9X9 codes
  const SPECIAL_ENC = {
    ',':'909', ';':'909',
    '.':'919',
    '"':'929', '\u201C':'929', '\u201D':'929', '\u00AB':'929', '\u00BB':'929', '\u201E':'929',
    '?':'939',
    '!':'949',
    ':':'959',
    '-':'969', '\u2010':'969', '\u2011':'969', '\u2012':'969',
    '\u2013':'969', '\u2014':'969', '\u2212':'969',
    '/':'979',
    '_':'989',
  };

  // 9X9 codes → canonical punctuation (for decryption)
  const SPECIAL_DEC = {
    '909':',', '919':'.', '929':'"', '939':'?', '949':'!', '959':':', '969':'-', '979':'/', '989':'_',
  };

  // Letter/space substitution (encrypt direction)
  const SUBST_ENC = {
    ' ':'0', 'e':'1', 'i':'2', 'a':'3', 'u':'4', 'o':'5', 'ü':'6', 'ä':'7', 'ö':'8', 'ß':'9'
  };

  // Digit substitution (decrypt direction)
  const SUBST_DEC = {
    '0':' ', '1':'e', '2':'i', '3':'a', '4':'u', '5':'o', '6':'ü', '7':'ä', '8':'ö', '9':'ß'
  };

  // Conflicting middle chars: ß + X + ß → 9[0-6]9 = special code → must be blocked
  // X ∈ {space, e, i, a, u, o, ü, ä, ö, ß}  (maps to 0–6)
  const CONFLICT_MIDDLE = /ß[ eiaouüEIAOUÜ]ß/g;

  // ── Input filtering ───────────────────────────────────────────────────────

  function isAllowedChar(ch) {
    return /[a-zA-ZäöüÄÖÜß0-9 ]/.test(ch) || (ch in SPECIAL_ENC);
  }

  function filterEncryptInput(text) {
    // 1. Remove disallowed characters
    let out = '';
    for (const ch of text) {
      if (isAllowedChar(ch)) out += ch;
    }
    // 2. Remove conflicting ßXß patterns (trailing ß gets dropped)
    //    Loop until stable (handles overlapping chains)
    let prev;
    do {
      prev = out;
      out = out.replace(CONFLICT_MIDDLE, m => m.slice(0, -1)); // drop last ß of match
    } while (out !== prev);
    return out;
  }

  // ── Core encrypt / decrypt ────────────────────────────────────────────────

  function encrypt(text) {
    if (!text) return '';

    // Step 1: normalise to lowercase and strip trailing spaces
    //         (trailing spaces would map to a leading '0' after rotation,
    //          which gets lost in the base-36 → decimal round-trip)
    text = text.toLowerCase().trimEnd();
    if (!text) return '';

    // Step 2: replace digits with internal bb* codes (before vowel substitution,
    //          so the substitution digits don't collide with vowel-mapped digits)
    text = text.replace(/[0-9]/g, d => DIGIT_CODES_ENC[d]);

    // Step 3: replace allowed punctuation with 9X9 codes
    let s = '';
    for (const ch of text) s += (ch in SPECIAL_ENC) ? SPECIAL_ENC[ch] : ch;

    // Step 4: substitute vowels/space/ß → digit; consonants + existing digits pass through
    let result = '';
    for (const ch of s) {
      if (ch in SUBST_ENC)           result += SUBST_ENC[ch];
      else if (/[a-z0-9]/.test(ch))  result += ch;
      // anything else (shouldn't reach here after filtering) is discarded
    }

    if (!result) return '';

    // Step 5: rotate – move last character to front
    const rotated = result[result.length - 1] + result.slice(0, -1);

    // Step 6: base-36 → decimal
    return base36ToDecimal(rotated);
  }

  function decrypt(text) {
    if (!text) return '';

    // Step 1: decimal → base-36
    const b36 = decimalToBase36(text);
    if (!b36) return '';

    // Step 2: rotate back – move first character to end
    const unrotated = b36.slice(1) + b36[0];

    // Step 3: replace 9X9 patterns with their special characters
    //         (must happen before single-digit substitution to avoid ambiguity)
    let s = unrotated.replace(/9([0-8])9/g, (_, d) => SPECIAL_DEC['9' + d + '9'] || '');

    // Step 4: reverse single-digit/letter substitution
    let result = '';
    for (const ch of s) result += (ch in SUBST_DEC) ? SUBST_DEC[ch] : ch;

    // Step 5: replace bb* codes back to their digits
    result = result.replace(/bb[bcdfghjkmn]/g, seq => DIGIT_CODES_DEC[seq] ?? seq);

    return result;
  }

  // ── Base-36 ↔ decimal (BigInt for arbitrary precision) ────────────────────

  function base36ToDecimal(str) {
    if (!str) return '';
    let num = 0n;
    for (const ch of str) {
      const c = ch.charCodeAt(0);
      let v;
      if (c >= 48 && c <= 57)  v = BigInt(c - 48);       // '0'–'9'
      else if (c >= 97 && c <= 122) v = BigInt(c - 87);  // 'a'–'z'
      else return '';                                      // invalid character
      num = num * 36n + v;
    }
    return num.toString();
  }

  function decimalToBase36(str) {
    if (!str) return '';
    let num;
    try { num = BigInt(str); } catch { return ''; }
    if (num === 0n) return '0';
    const chars = '0123456789abcdefghijklmnopqrstuvwxyz';
    let res = '';
    while (num > 0n) {
      res = chars[Number(num % 36n)] + res;
      num /= 36n;
    }
    return res;
  }

  // ── UI handlers ───────────────────────────────────────────────────────────

  function setMode(m) {
    mode = m;
    document.getElementById('btnEncrypt').classList.toggle('active', m === 'encrypt');
    document.getElementById('btnDecrypt').classList.toggle('active', m === 'decrypt');
    document.getElementById('toggleSlider').classList.toggle('right', m === 'decrypt');

    const inputBox = document.getElementById('inputBox');
    if (m === 'encrypt') {
      inputBox.placeholder = 'Enter text…';
      document.getElementById('labelInput').textContent  = 'Text';
      document.getElementById('labelOutput').textContent = 'Encrypted';
    } else {
      inputBox.placeholder = 'Enter encrypted text…';
      document.getElementById('labelInput').textContent  = 'Encrypted';
      document.getElementById('labelOutput').textContent = 'Decrypted';
    }
    inputBox.value = '';
    document.getElementById('outputBox').value = '';
  }

  function swapMode() {
    const outputText = document.getElementById('outputBox').value;
    const newMode = mode === 'encrypt' ? 'decrypt' : 'encrypt';
    setMode(newMode);
    if (outputText) {
      document.getElementById('inputBox').value = outputText;
      handleInput();
    }
  }

  function clearInput() {
    document.getElementById('inputBox').value  = '';
    document.getElementById('outputBox').value = '';
  }

  function handleInput() {
    const inputBox = document.getElementById('inputBox');
    const raw = inputBox.value;
    const rawCursor = inputBox.selectionStart;

    if (mode === 'encrypt') {
      // Pass 1: filter disallowed chars, track cursor
      let s = '';
      let cur = rawCursor;
      for (let i = 0; i < raw.length; i++) {
        if (isAllowedChar(raw[i])) {
          s += raw[i];
        } else if (i < rawCursor) {
          cur--;
        }
      }

      // Pass 2: remove all conflicting patterns, loop until stable
      //   a) ßXß sequences (conflict with 9X9 special-char codes)
      //   b) digit immediately after 'b'   → "b5"  : drop the digit
      //   c) 'b' immediately after digit   → "5b"  : drop the b
      //      (both needed: "5b5" encodes to "bbhbbbh" which mis-parses as digit-0 + garbage)
      //   d) bb[bcdfghjkmn] sequences (would be decoded as a digit code)
      let prev;
      do {
        prev = s;
        s = s.replace(CONFLICT_MIDDLE, m => m.slice(0, -1));
        s = s.replace(/b([0-9])/gi, m => m[0]);
        s = s.replace(/([0-9])b/gi, m => m[0]);
        s = s.replace(/bb[bcdfghjkmn]/gi, m => m.slice(0, -1));
      } while (s !== prev);

      const finalCursor = Math.max(0, Math.min(cur, s.length));
      inputBox.value = s;
      inputBox.selectionStart = inputBox.selectionEnd = finalCursor;

      document.getElementById('outputBox').value = encrypt(s);
    } else {
      // Decrypt mode: only decimal digits allowed
      const cleaned = raw.replace(/[^0-9]/g, '');
      if (cleaned !== raw) inputBox.value = cleaned;
      document.getElementById('outputBox').value = decrypt(cleaned);
    }
  }

  function copyOutput() {
    const val = document.getElementById('outputBox').value;
    if (!val) return;
    navigator.clipboard.writeText(val).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><polyline points="20 6 9 17 4 12"/></svg>`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
      }, 1800);
    });
  }

  setMode('encrypt');
</script>
</body>
</html>
